# Self-assessment against the Home Assistant integration quality scale.
# hassfest does not validate this file for custom integrations.
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not register any service actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: This integration does not register any service actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: Entities do not subscribe to events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry:
    status: done
    comment: >-
      The Vallox Modbus manual documents no device identity, so duplicates are
      detected by serial port and unit ID.

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: This integration does not have an options flow.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: A Modbus RTU link has no authentication.
  test-coverage: done

  # Gold
  devices:
    status: todo
    comment: >-
      Model, serial number and software version are not documented in the
      Vallox Modbus manual, so the device has no model information yet.
  diagnostics: done
  discovery:
    status: exempt
    comment: A Modbus RTU unit cannot be discovered.
  discovery-update-info:
    status: exempt
    comment: A Modbus RTU unit cannot be discovered.
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: Each config entry represents exactly one fixed device.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: No repairable issues are raised.
  stale-devices:
    status: exempt
    comment: Each config entry represents exactly one fixed device.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: This integration talks Modbus, not HTTP.
  strict-typing: todo
